version: "0.1.0"
shared_exemptions:
  - 用户不配合导致SOP无法完成时不扣分。
  - 用户确认问题已解决时，不因未执行剩余SOP扣分。
  - 客服友善婉拒电话或主管等特殊要求不扣分。
  - 前后不一致但有主动纠正及正确引导时按免责处理。
  - 同一问题在本维度只扣一次，跨维度由第四周统一核对。
items:
  SP-01: 发送完整规范欢迎语得5分；仅“您好/Hi”或无欢迎语得0分。
  SP-02: 准确理解定位需求，获取必要信息得5分；客服已确认但用户不回复不扣分；误解需求或方向错误0分。
  SP-03: 完整解答、用户确认解决、正确升级工单、合理回复合规问题或因用户缺信息无法继续均5分；明确问题完全未回应处理0分。
  SP-04: 标签与咨询语义一致5分，遗漏或错误0分；没有正式标签目录时只能判断语义一致性。
  SP-05: 礼貌结束、系统自动关闭、询问或提供方案后有证据等待5分钟无回复可5分；直接结束且无礼貌表达0分；记录截断不推定结束。
  PS-01: 从30分按当前类别的A类专业条款扣分，下限0；所有专业免责条件优先；不凭常识虚构平台政策。
  PS-02: 从10分按当前类别S类条款扣分，下限0；用户多次问同一问题仍被要求重述扣5分；必要核实、系统阶段重复和合理纠正不扣。
  PS-03: 原始Prompt规定沟通反馈默认满分10分，不自行新增扣分规则。
  CM-01: 请、您等礼貌用语，语言温和，无责备或推卸，全部符合5分，任一违反0分；语义判断而非逐句强制包含“请”。
  CM-02: 无错字或语法问题，标点规范、无重复标点和负面表情，发现错误及时更正可合规；符合5分，否则0分，忽略HTML空格。
  CM-03: system连接人工事件至首条人工回复不超过90秒得5分，超过0分；缺事件或有效时间为不可评估。
  CM-04: 用户待回复消息至下一人工回复不超过300秒得5分；超过且无合理说明0分；主动说明延迟原因或及时纠错解释可免责。
  CM-05: 人工转接前有规范话术且无不必要错误转接得5分，否则0分；机器人转人工不计入评分，没有人工转接行为不扣分。
