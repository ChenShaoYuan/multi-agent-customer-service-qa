[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-customer-service-qa"
version = "0.1.0"
description = "A LangGraph-based multi-agent workflow for customer service quality auditing."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
extend-exclude = ["reference"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

